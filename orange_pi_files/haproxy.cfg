global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    option tcplog

    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend dns_over_tls
    bind :853 ssl crt /usr/local/etc/haproxy/certs/dns.pem ssl-min-ver TLSv1.2
    default_backend adguard_dns

backend adguard_dns
    server adguard adguard:53 check
